openapi: 3.0.0 
info: 
  title: Project Service API 
  version: 1.0.0 
paths: 
  /projects: 
    get: 
      summary: Retrieve a list of projects 
      responses: 
        '200': 
          description: A list of projects 
          content: 
            application/json: 
              schema: 
                type: array 
                items: 
                  $ref: '#/components/schemas/Project' 
  /projects/{id}: 
    get: 
      summary: Retrieve a specific project by ID 
      parameters: 
        - name: id 
          in: path 
          required: true 
          schema: 
            type: string 
      responses: 
        '200': 
          description: A single project 
          content: 
            application/json: 
              schema: 
                $ref: '#/components/schemas/Project' 
components: 
  schemas: 
    Project: 
      type: object 
      properties: 
        id: 
          type: string 
        name: 
          type: string 
        description: 
          type: string